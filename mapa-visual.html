<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa HeroQuest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #110d06;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      color: #d4b86a;
      padding: 24px;
      gap: 18px;
    }
    h1 { font-size: 20px; letter-spacing: 4px; text-shadow: 0 0 12px #8B6914; }
    .board-wrap {
      border: 5px solid #5a3e10;
      border-radius: 3px;
      box-shadow: 0 0 40px rgba(139,105,20,0.4);
      background: #3d3830;
      line-height: 0;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(26, 24px);
      grid-template-rows: repeat(19, 24px);
      position: relative;
    }
    .cell {
      width: 24px;
      height: 24px;
      position: relative;
    }
    .wall       { background: #1e1a14; }
    .corridor   { background: #c8b878; border: 0.5px solid rgba(0,0,0,0.2); }
    .white-cell { background: #ffffff; }
    .room-outline {
      position: absolute;
      border: 2px solid #000;
      pointer-events: none;
      z-index: 10;
      box-sizing: border-box;
    }

    /* Colores de salas */
    .s1  { background: #7a5c18; }
    .s2  { background: #9e2020; }
    .s3  { background: #3f8880; }
    .s4  { background: #b35218; }
    .s5  { background: #90aaaa; }
    .s6  { background: #b89848; }
    .s7  { background: #565e56; }
    .s8  { background: #6a9e2a; }
    .s9  { background: #1e1b18; border: 0.5px solid #333; }
    .s10 { background: #a88818; }
    .s11 { background: #889228; }
    .s12 { background: #b8a818; }
    .s13 { background: #306878; }
    .s14 { background: #607080; }
    .s15 { background: #a89038; }
    .s16 { background: #684078; }
    .s17 { background: #801a1a; }
    .s18 { background: #a88018; }
    .s19 { background: #986068; }
    .s20 { background: #489828; }
    .s21 { background: #4a5898; }
    .s22 { background: #2c2420; border: 0.5px solid #444; }

    .label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.95);
      font-size: 7px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.95);
      pointer-events: none;
      z-index: 5;
      text-align: center;
      line-height: 1.2;
    }
    /* Leyenda */
    .legend {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px 14px;
      max-width: 750px;
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,184,106,0.2);
      border-radius: 4px;
    }
    .legend-title {
      grid-column: 1/-1;
      font-size: 10px;
      letter-spacing: 2px;
      color: #d4b86a;
      margin-bottom: 2px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot {
      width: 13px; height: 13px;
      border-radius: 2px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .legend-text { font-size: 9px; color: #c8a878; }
    .nota { font-size: 9px; color: #6a5a40; max-width: 700px; text-align: center; }
  </style>
</head>
<body>
  <h1>⚔ MAPA HEROQUEST ⚔</h1>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="legend" id="legend"></div>
  <p class="nota">Basado en mapa dibujado a mano. Pasillos en amarillo (transitables). Bordes oscuros = muros. S22 = Sala Central.</p>

<script>
const COLS = 26, ROWS = 19;

// Inicializar todo como corredor (amarillo), luego pintar muros y salas
const grid = Array.from({length: ROWS}, () =>
  Array.from({length: COLS}, () => 'corridor')
);

// Salas: [filaInicio, filaFin, colInicio, colFin, clase, etiqueta]
// Coordenadas 1-indexed (interior del tablero)
const rooms = [
  // --- CLUSTER SUPERIOR-IZQUIERDO ---
  [1, 3,  1,  4,  's1',  'S1\n4×3'],
  [1, 3,  5,  8,  's2',  'S2\n4×3'],
  [1, 5,  9, 11, 's3',  'S3\n3×5'],
  [4, 8,  1,  4,  's4',  'S4\n4×5'],
  [4, 8,  5,  8,  's5',  'S5\n4×5'],

  // --- CLUSTER SUPERIOR-DERECHO ---
  [1, 5,  14, 16, 's6',  'S6\n3×5'],
  [1, 4,  17, 20, 's7',  'S7\n4×4'],
  [1, 4,  21, 24, 's8',  'S8\n4×4'],
  [5, 8,  17, 20, 's9',  'S9\n4×4'],
  [5, 8,  21, 24, 's10', 'S10\n4×4'],

  // --- SALA CENTRAL ---
  [7, 11, 10, 15, 's22', 'S22\nCENTRAL 6×5'],

  // --- CLUSTER INFERIOR-IZQUIERDO ---
  [10,13,  1,  4,  's11', 'S11\n4×4'],
  [10,12,  5,  6,  's13', 'S13\n2×3'],
  [10,12,  7,  8,  's14', 'S14\n2×3'],
  [14,17,  1,  4,  's12', 'S12\n4×4'],
  [13,17,  5,  8,  's15', 'S15\n4×5'],
  [13,17,  9,  11, 's16', 'S16\n3×5'],

  // --- CLUSTER INFERIOR-DERECHO ---
  [10,12, 17, 20, 's19', 'S19\n4×4'],
  [13,13, 18, 20, 's19', ''],
  [13,17, 14, 17, 's17', 'S17\n4×5'],
  [14,17, 18, 20, 's18', 'S18\n3×4'],
  [10,13, 21, 24, 's20', 'S20\n4×4'],
  [14,17, 21, 24, 's21', 'S21\n4×4'],
];

// Centros para etiquetas
const labelMap = {};

for (const [rs, re, cs, ce, cls, lbl] of rooms) {
  const cr = Math.round((rs + re) / 2);
  const cc = Math.round((cs + ce) / 2);
  const key = `${cr},${cc}`;
  if (!labelMap[key]) labelMap[key] = lbl;

  for (let r = rs; r <= re; r++)
    for (let c = cs; c <= ce; c++)
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS)
        grid[r][c] = cls;
}

// Generar HTML
const board = document.getElementById('board');
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div');
    cell.className = 'cell ' + grid[r][c];
    const key = `${r},${c}`;
    if (labelMap[key]) {
      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.innerHTML = labelMap[key].replace('\n', '<br>');
      cell.appendChild(lbl);
    }
    board.appendChild(cell);
  }
}

// Contornos de salas
const CELL = 24;
for (const [rs, re, cs, ce] of rooms) {
  const outline = document.createElement('div');
  outline.className = 'room-outline';
  outline.style.left   = (cs * CELL) + 'px';
  outline.style.top    = (rs * CELL) + 'px';
  outline.style.width  = ((ce - cs + 1) * CELL) + 'px';
  outline.style.height = ((re - rs + 1) * CELL) + 'px';
  board.appendChild(outline);
}

// Leyenda
const roomColors = {
  s1:'#7a5c18',s2:'#9e2020',s3:'#3f8880',s4:'#b35218',s5:'#90aaaa',
  s6:'#b89848',s7:'#565e56',s8:'#6a9e2a',s9:'#1e1b18',s10:'#a88818',
  s11:'#889228',s12:'#b8a818',s13:'#306878',s14:'#607080',s15:'#a89038',
  s16:'#684078',s17:'#801a1a',s18:'#a88018',s19:'#986068',s20:'#489828',
  s21:'#4a5898',s22:'#2c2420'
};

const legend = document.getElementById('legend');
const title = document.createElement('div');
title.className = 'legend-title';
title.textContent = 'SALAS';
legend.appendChild(title);

for (const [rs, re, cs, ce, cls, lbl] of rooms) {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const dot = document.createElement('div');
  dot.className = 'legend-dot';
  dot.style.background = roomColors[cls] || '#555';
  const txt = document.createElement('span');
  txt.className = 'legend-text';
  txt.textContent = lbl.replace('\n', ' ');
  item.appendChild(dot);
  item.appendChild(txt);
  legend.appendChild(item);
}
</script>
</body>
</html>
